# Install after obtaining certificates with Certbot.
# The app and Umami containers bind only to localhost on the Proxmox VM.

server {
    listen 80;
    listen [::]:80;
    server_name pietergeerts.eu www.pietergeerts.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pietergeerts.eu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pietergeerts.eu;

    ssl_certificate /etc/letsencrypt/live/pietergeerts.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pietergeerts.eu/privkey.pem;

    return 301 https://pietergeerts.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pietergeerts.eu;

    ssl_certificate /etc/letsencrypt/live/pietergeerts.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pietergeerts.eu/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name analytics.pietergeerts.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://analytics.pietergeerts.eu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.pietergeerts.eu;

    ssl_certificate /etc/letsencrypt/live/analytics.pietergeerts.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.pietergeerts.eu/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
